<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-size: 13px;
  }

  /* Cabeçalho Principal */
  th.header-principal {
    background: linear-gradient(135deg, #0288d1, #00b0ff);
    color: white;
    font-weight: bold;
    font-size: 16px;
    padding: 10px;
    text-transform: uppercase;
    border: 1px solid #333;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }

  th.sub-header {
    background-color: #b2ebf2;
    color: #004d40;
    font-weight: bold;
    font-size: 12px;
    border: 1px solid #444;
    padding: 4px;
  }

  td {
    border: 1px solid #444;
    height: 24px;
    text-align: center;
    padding: 0;
  }

  /* Bordas verticais internas azuis */
  .col-grid {
    border-right: 1px solid #0288d1;
  }

  /* Estilo da primeira coluna de cada lado (Nu) */
  .col-id {
    width: 5%;
    font-weight: bold;
    color: #111;
    border-right: 1px solid #000;
  }

  /* Espaço central entre as duas tabelas */
  .col-espaco {
    width: 2%;
    border: none !important;
    background: white !important;
  }

  /* DEGRADÊ EM AZUL CÉU NAS LINHAS PARES (Começa nos números) */
  tr:nth-child(even) td:not(.col-espaco) {
    background: linear-gradient(to right, #e1f5fe, #b3e5fc, #e1f5fe);
  }

  /* Linhas ímpares com fundo branco limpo */
  tr:nth-child(odd) td:not(.col-espaco) {
    background-color: #ffffff;
  }
</style>
</head>
<body>

<table>
  <thead>
    <!-- Cabeçalho Principal -->
    <tr>
      <th colspan="17" id="mes-e-data" class="header-principal"></th>
    </tr>
    <!-- Sub-cabeçalhos (Nu | m³ (3) | Valor (4)) -->
    <tr>
      <th class="sub-header">Nu</th>
      <th colspan="3" class="sub-header">m³</th>
      <th colspan="4" class="sub-header">Valor</th>
      
      <th class="col-espaco"></th>
      
      <th class="sub-header">Nu</th>
      <th colspan="3" class="sub-header">m³</th>
      <th colspan="4" class="sub-header">Valor</th>
    </tr>
  </thead>
  <tbody id="tabela-corpo">
  </tbody>
</table>

<script>
  // Função para atualizar o cabeçalho com a data no momento da visualização/impressão
  function atualizarDataCabecalho() {
    const dataAtual = new Date();
    const opcoesMes = { month: 'long' };
    let mes = dataAtual.toLocaleDateString('pt-BR', opcoesMes).toUpperCase();
    const dia = dataAtual.getDate();
    document.getElementById('mes-e-data').textContent = `${mes} (DIA ${dia})`;
  }

  atualizarDataCabecalho();
  window.onbeforeprint = atualizarDataCabecalho;

  // Sequência de dados original mantida
  const sequenciaOriginal = [
    10, 42, 16, 113, 106, 87, 149, 96, 21, 85, 23, 15, 19, 72, 76, 65, 30, 144, 55, 52, 94, 
    83, 75, 116, 51, 48, 60, 145, 158, 100, 88, 118, 139, 143, 114, 142, 33, 121, 7, 
    155, 13, 102, 146, 95, 111, 133, 151, 147, 101, 148, 104, 154, 99, 102, 108, 126, 
    124, 110, 130, 67, 71, 29, 50, 112, 97, 140, 117, 120, 92, 107, 77, 63, 138, 6, 
    2, 141, 68, 1, 73, 17, 25, 9, 132, 22, 20, 69, 91, 134, 156, 150, 98, 104, 62, 
    82, 127, 152, 128, 37, 136, 11, 93, 57, 119, 18, 24, 125, 90, 129, 8, 3, 26, 
    58, 61, 80, 59, 137, 44
  ];

  // Regra original de preenchimento: identifica o que falta até 200 sem duplicar números
  const limiteMaximo = 200;
  const conjuntoOriginal = new Set(sequenciaOriginal);
  const faltantes = [];
  
  for (let i = 1; i <= limiteMaximo; i++) {
    if (!conjuntoOriginal.has(i)) faltantes.push(i);
  }

  // Lista com a sequência exata no início e os faltantes completando até 200 no final
  const listaCompleta = [...sequenciaOriginal, ...faltantes];

  // Renderização da tabela mantendo a alternância linha a linha (2 a 2)
  const corpoTabela = document.getElementById('tabela-corpo');
  
  for (let i = 0; i < listaCompleta.length; i += 2) {
    const tr = document.createElement('tr');
    
    const id1 = listaCompleta[i];
    const id2 = listaCompleta[i + 1] !== undefined ? listaCompleta[i + 1] : "";

    tr.innerHTML = `
      <!-- Bloco Esquerdo -->
      <td class="col-id">${id1}</td>
      <!-- 3 Caixas para m³ -->
      <td class="col-grid"></td>
      <td class="col-grid"></td>
      <td class="col-grid" style="border-right: 1px solid #000;"></td>
      <!-- 4 Caixas para Valor -->
      <td class="col-grid"></td>
      <td class="col-grid"></td>
      <td class="col-grid"></td>
      <td></td>

      <!-- Espaço Central -->
      <td class="col-espaco"></td>

      <!-- Bloco Direito -->
      <td class="col-id">${id2}</td>
      <!-- 3 Caixas para m³ -->
      <td class="col-grid"></td>
      <td class="col-grid"></td>
      <td class="col-grid" style="border-right: 1px solid #000;"></td>
      <!-- 4 Caixas para Valor -->
      <td class="col-grid"></td>
      <td class="col-grid"></td>
      <td class="col-grid"></td>
      <td></td>
    `;
    corpoTabela.appendChild(tr);
  }
</script>

</body>
</html>
